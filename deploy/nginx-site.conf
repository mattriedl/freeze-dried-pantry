# Example nginx config for this site. Replace freezedryclub.com and the root path.
# Install: sudo cp nginx-site.conf /etc/nginx/sites-available/freezedryclub.com
#          sudo ln -s /etc/nginx/sites-available/freezedryclub.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d freezedryclub.com -d www.freezedryclub.com   (free HTTPS)
server {
    listen 80;
    server_name www.freezedryclub.com;
    return 301 https://freezedryclub.com$request_uri;
}

server {
    listen 80;
    server_name freezedryclub.com;
    root /var/www/freezedryclub.com;
    index index.html;

    # Pretty URLs: /how-to-freeze-dry-eggs/ -> /how-to-freeze-dry-eggs/index.html
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Long cache for fingerprinted assets, short for HTML.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml text/plain;
}
