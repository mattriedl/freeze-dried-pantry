# Apache virtual host for freezedryclub.com (Ubuntu 24.04).
# Site rules (redirects, caching, 404 page) live in public/.htaccess and deploy with the site.
#
# Install:
#   sudo cp apache-site.conf /etc/apache2/sites-available/freezedryclub.com.conf
#   sudo a2enmod rewrite headers deflate
#   sudo a2ensite freezedryclub.com
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d freezedryclub.com -d www.freezedryclub.com
# certbot adds the :443 virtual host and the http->https redirect for you.

<VirtualHost *:80>
    ServerName freezedryclub.com
    ServerAlias www.freezedryclub.com
    DocumentRoot /var/www/freezedryclub.com

    <Directory /var/www/freezedryclub.com>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/freezedryclub.com-error.log
    CustomLog ${APACHE_LOG_DIR}/freezedryclub.com-access.log combined
</VirtualHost>
