name: Auto-post article

# Runs hourly; the generator's randomized schedule decides whether this hour publishes.
# Nothing happens until you set the repository variable AUTOPOST_ENABLED=true.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish one article now (ignore the schedule)'
        type: boolean
        default: true
      keyword:
        description: 'Optional: exact keyword from the queue to write about'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    if: vars.AUTOPOST_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate article
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
          SCHEDULE_CHECK: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '0' || '1' }}
          FORCE_KEYWORD: ${{ inputs.keyword }}
        run: |
          if [ -n "$FORCE_KEYWORD" ]; then
            node scripts/generate-post.mjs --keyword "$FORCE_KEYWORD"
          else
            node scripts/generate-post.mjs
          fi

      # Mark a topic that failed quality checks so the next run moves on.
      - name: Record skipped topic
        if: steps.gen.outputs.failed == 'true' && vars.REVIEW_MODE != 'true'
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add data && git commit -m "Queue: skip topic that failed quality checks" && git push || true

      # Never push a broken site: the build must pass first.
      - name: Build check
        if: steps.gen.outputs.published == 'true'
        run: npm run build

      - name: Publish directly (auto mode)
        if: steps.gen.outputs.published == 'true' && vars.REVIEW_MODE != 'true'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add src/content/posts data
          git commit -m "Publish: $TITLE"
          git push

      - name: Open a pull request instead (review mode)
        if: steps.gen.outputs.published == 'true' && vars.REVIEW_MODE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.gen.outputs.title }}
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          BRANCH="post/$SLUG"
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/posts data
          git commit -m "Draft: $TITLE"
          git push -u origin "$BRANCH"
          gh pr create --title "Draft: $TITLE" --body "New auto-generated article for review. Merge to publish."

      # Give Cloudflare Pages time to deploy, then ping Bing & co. via IndexNow.
      - name: Notify search engines (IndexNow)
        if: steps.gen.outputs.published == 'true' && vars.REVIEW_MODE != 'true'
        continue-on-error: true
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          sleep 240
          node scripts/indexnow.mjs "/$SLUG/"
